name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Полная сборка требует вузовской библиотеки RSREU.IO, которой нет в репозитории
      - name: Исходники в UTF-8
        run: |
          for f in InvestWinApp/*.h InvestWinApp/*.cpp; do
            iconv -f utf-8 -t utf-8 "$f" > /dev/null || { echo "не UTF-8: $f"; exit 1; }
          done
