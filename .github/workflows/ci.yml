name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Сборка (C++/CLI, .NET Framework 4.8)
        run: msbuild InvestWinApp.sln /p:Configuration=Release /p:Platform=x64 /m
      - uses: actions/upload-artifact@v4
        with:
          name: InvestWinApp
          path: x64/Release/*.exe
